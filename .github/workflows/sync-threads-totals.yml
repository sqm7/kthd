name: Sync Threads totals

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed site
        uses: actions/checkout@v4

      - name: Fetch media content totals
        run: |
          curl --fail --silent --show-error --location \
            'https://zxbmbbfrzbtuueysicoc.supabase.co/functions/v1/sqm-media-top-posts?format=media-v3&view=content-totals-v1' \
            -o /tmp/media-response.json
          jq -e '.contentTotals | has("views") and has("likes") and has("replies") and has("shares") and has("postsCount")' /tmp/media-response.json >/dev/null
          jq --arg syncedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{contentTotals: .contentTotals, syncedAt: $syncedAt}' /tmp/media-response.json \
            > data/threads-totals.json

      - name: Commit changed totals
        run: |
          if git diff --quiet -- data/threads-totals.json; then
            echo 'No Threads totals change'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/threads-totals.json
          git commit -m 'chore: sync Threads content totals'
          git push
